name: Database isolation regression
on:
  push:
    branches:
      - fix/approved-ui-batch-20261015
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  database-isolation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies without postinstall or database access
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Run offline database isolation tests
        run: npm run test:db-isolation
