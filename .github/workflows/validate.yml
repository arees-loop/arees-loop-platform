name: Validate
on: [pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: public.ecr.aws/docker/library/postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: arees_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d arees_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/arees_ci
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install and generate Prisma client
        run: npm ci
      - name: Validate Prisma schema
        run: npx prisma validate
      - name: Apply migrations to disposable CI database
        run: npx prisma migrate deploy
      - name: Unit and API security regression tests
        run: npm test
      - name: Disposable PostgreSQL constraint and concurrency tests
        run: npm run test:db
      - name: TypeScript
        run: npx tsc --noEmit
      - name: ESLint
        run: |
          set -o pipefail
          npm run lint 2>&1 | tee eslint-output.log
      - name: Save ESLint diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eslint-diagnostics
          path: eslint-output.log
          if-no-files-found: ignore
          retention-days: 3
      - name: Production build without deployment
        run: npm run build
