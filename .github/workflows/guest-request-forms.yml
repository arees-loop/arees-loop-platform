name: Request forms guest access check
on:
  push:
    branches: [fix/auth-on-request-submit-20261127]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: postgresql://preview_only:preview_only@127.0.0.1:5432/arees_preview
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - name: Auth gate behavioral contract
        run: node scripts/verify-guest-request-flow.mjs
      - name: TypeScript
        run: npx tsc --noEmit
      - name: Lint only touched React files
        run: npx eslint app/components/AuthenticatedRequestGate.tsx app/transport/TransportRequestPage.tsx app/components/RequestServicePage.tsx app/components/InternationalLicenseForm.tsx app/visas/\[id\]/page.tsx
      - name: Build
        run: npm run build
