name: Customer feature safe checks

on:
  push:
    branches:
      - feature/customer-experience-r07-r09-r10-20261012
      - feature/government-partner-join-20261013
      - fix/release-cart-payments-visa-notice-20261022
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: postgresql://unused:unused@127.0.0.1:5432/unused
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install pinned dependencies
        run: npm ci
      - name: Generate Prisma client only (no database connection or migration)
        run: npx prisma generate
      - name: TypeScript checks
        run: npx tsc --noEmit
      - name: Public visa page lint (blocking)
        run: npx eslint app/components/RequestServicePage.tsx --quiet
      - name: Global lint audit (existing backlog reported)
        continue-on-error: true
        run: npm run lint
      - name: Next.js production build with dummy database
        run: npm run build
