name: Customer feature safe checks

on:
  push:
    branches:
      - feature/customer-experience-r07-r09-r10-20261012
      - feature/government-partner-join-20261013
      - feature/cart-bank-checkout-20261020
      - fix/license-form-mail-alerts-20261020
      - feature/partner-cart-in-bookings-20261020
      - fix/mobile-rewards-nav-seal-20261020
      - fix/rewards-bottom-nav-tight-spacing-20261020
      - fix/rewards-pill-background-width-20261020
      - fix/rewards-original-spacing-inside-pill-20261020
  pull_request:
    branches:
      - codex/license-card-layout-20261020
      - feature/cart-bank-checkout-20261020
      - fix/license-form-mail-alerts-20261020
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: postgresql://unused:unused@127.0.0.1:5432/unused
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install pinned dependencies
        run: npm ci
      - name: Generate Prisma client only (no database connection or migration)
        run: npx prisma generate
      - name: TypeScript checks
        run: npx tsc --noEmit
      - name: Changed checkout files ESLint (errors blocking)
        run: npx eslint app/cart app/components/CartBankCheckout.tsx app/components/InternationalLicenseForm.tsx app/api/cart app/api/admin/cart-bank-payments app/admin/cart-bank-payments app/admin/bookings/page.tsx app/api/license-cart-application app/api/customer/saved-arees-services app/api/admin/request-alerts/route.ts app/components/AreesServiceActions.tsx app/components/SavedAreesServices.tsx app/components/AdminNotificationCenter.tsx app/favorites/page.tsx app/transport/TransportRequestPage.tsx app/components/RequestServicePage.tsx app/hotels/HotelsClient.tsx app/api/coupons/validate/route.ts lib/license-cart-coupon.ts app/api/admin/license-cart-workflow/route.ts app/api/admin/license-cart-document/route.ts app/components/LicenseCartOrderDetail.tsx app/admin/transport/TransportDesk.tsx app/admin/dashboard/page.tsx app/api/admin/bookings/route.ts app/api/admin/partner-cart-workflow/route.ts app/components/PartnerBookingDetail.tsx lib/partner-cart-bookings.ts app/rewards/page.tsx --quiet
      - name: Global ESLint audit (legacy debt visible, not a release bypass)
        continue-on-error: true
        run: npm run lint
      - name: Next.js production build (dummy DB only)
        run: npm run build
